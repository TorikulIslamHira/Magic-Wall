# Magic Wall: build and run with `docker compose up -d --build` from the repo root.
# Settings come from .env (copy .env.example to .env and set a real admin key).

# Fixed project name, so the data volume is always "magicwall_magicwall-data"
# regardless of the folder the repo is cloned into.
name: magicwall

services:
  magicwall:
    build:
      context: ./src/MagicWall.Api
    image: magicwall:latest
    container_name: magicwall
    restart: unless-stopped

    # Two ports, two audiences. Inside the container they are always 8080 / 8081; the host side
    # comes from .env. A plain port listens on every network card (IPv4 and IPv6); "IP:port"
    # (e.g. MAGICWALL_ADMIN_PORT=127.0.0.1:8081) limits it to one address. Don't write 0.0.0.0:
    # that drops IPv6, and "localhost" then stalls ~2 s per request while falling back to IPv4.
    ports:
      - "${MAGICWALL_PRESENTER_PORT:-8080}:8080"   # presenter: wall + hub, read-only
      - "${MAGICWALL_ADMIN_PORT:-8081}:8081"       # admin: control room, all writes

    environment:
      # Required: compose refuses to start without it, rather than running with admin writes disabled.
      Admin__ApiKey: "${MAGICWALL_ADMIN_KEY:?Set MAGICWALL_ADMIN_KEY in .env (see .env.example)}"
      # Local testing only: the dashboard pre-fills the key. Keep false on a shared network.
      Admin__AutoFillKey: "${MAGICWALL_ADMIN_AUTOFILL:-false}"
      # First admin account, created only when no users exist yet.
      Auth__BootstrapAdmin__Password: "${MAGICWALL_BOOTSTRAP_PASSWORD:-}"
      # Local testing only: demo accounts field1 / desk1 / sports1 / admin.
      Auth__SeedDemoUsers: "${MAGICWALL_DEMO_USERS:-false}"
      Sports__Feed__Enabled: "${MAGICWALL_SPORTS_FEED:-true}"
      ConnectionStrings__MagicWall: "Data Source=/data/magicwall.db"

    volumes:
      - magicwall-data:/data

    # The base image has no curl, so probe with bash's built-in /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/wall/state HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # Cap log size: the wall box may run for months without anyone looking at it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  magicwall-data:
